name: Hava durumu

on:
  workflow_dispatch:
  # GFS her 6 saatte bir çalışır, tahminler ~4 saat sonra yayımlanır.
  # Depo büyümesini sınırlamak için günde 2 kez: 04:40 ve 16:40 UTC
  schedule:
    - cron: "40 4,16 * * *"

permissions:
  contents: write

concurrency:
  group: weather
  cancel-in-progress: false

jobs:
  weather:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: GRIB çözücüyü kur
        run: python -m pip install --quiet eccodes eccodeslib

      - name: GFS tahminlerini indir ve işle
        run: python scripts/fetch_weather.py

      - name: Depoya yaz
        run: |
          git config user.name "dunya-haritasi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A data/weather
          if git diff --cached --quiet; then
            echo "Değişiklik yok."
            exit 0
          fi
          git commit -m "Hava durumu $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
