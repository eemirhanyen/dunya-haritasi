name: Veriyi güncelle

on:
  # Elle çalıştırma: GitHub > Actions > "Veriyi güncelle" > Run workflow
  workflow_dispatch:
  # Betik değişince bir kez çalış
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - ".github/workflows/update-data.yml"
  # Her gün 03:17 UTC (Türkiye saatiyle 06:17)
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Endeks verisini çek ve skorla
        run: python scripts/fetch_index.py

      - name: Değiştiyse depoya yaz
        run: |
          if git diff --quiet -- data/countries.json && git ls-files --error-unmatch data/countries.json >/dev/null 2>&1; then
            echo "Veri değişmedi."
            exit 0
          fi
          git config user.name "dunya-haritasi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/countries.json
          git commit -m "Veri güncellemesi $(date -u +%Y-%m-%d)"
          git push
