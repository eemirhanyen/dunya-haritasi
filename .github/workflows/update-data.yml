name: Veriyi güncelle

on:
  # Elle çalıştırma: GitHub > Actions > "Veriyi güncelle" > Run workflow
  workflow_dispatch:
    inputs:
      only:
        description: "Yalnızca bu ülkeler (ör. TUR,GRC,ISR). Boş = hepsi"
        required: false
        default: ""
  # Her gün 03:17 UTC (Türkiye saatiyle 06:17)
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      ONLY: ${{ github.event.inputs.only }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Bir adım hata verirse önceki günün dosyası korunur, diğer adımlar sürer.
      - name: Endeks verisi
        continue-on-error: true
        run: python scripts/fetch_index.py

      - name: Haberler ve borsa (GDELT ~30 dk)
        id: news
        continue-on-error: true
        run: python scripts/fetch_news.py

      - name: AI değerlendirmesi
        if: steps.news.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/ai_score.py

      - name: Site verisini birleştir
        run: python scripts/build.py

      - name: Değiştiyse depoya yaz
        run: |
          git config user.name "dunya-haritasi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "Veri değişmedi."
            exit 0
          fi
          git commit -m "Veri güncellemesi $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4 5; do
            git pull --rebase -X theirs origin main && git push && exit 0
            sleep $((i * 10))
          done
          exit 1
