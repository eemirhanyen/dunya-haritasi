name: Kaynak testi
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/probe/probe.py > scripts/probe/out.txt 2>&1 || true
      - run: |
          git config user.name "dunya-haritasi-bot"
          git config user.email "actions@users.noreply.github.com"
          git add scripts/probe/out.txt && git commit -m "probe çıktısı" && git pull --rebase && git push
